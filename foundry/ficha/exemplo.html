<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ficha · exemplo do pacote</title>
    <!-- as fontes: no Foundry o módulo já carrega Libre Baskerville, Vollkorn e Source Sans 3 -->
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Vollkorn:ital,wght@0,400..700;1,400..600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./ficha.css" />
    <style>
      html, body { margin: 0; background: #0f131c; }
      /* o host dá o tamanho: a ficha preenche o elemento onde é montada */
      #alvo { width: min(1120px, 100vw - 40px); height: min(860px, 100vh - 40px); margin: 20px auto; }
    </style>
  </head>
  <body>
    <div id="alvo"></div>
    <script src="./ficha.js"></script>
    <script>
      const dados = FichaExposicao.exemplo();
      // `aoMudar` é o que o Foundry usaria para gravar no ator
      const ficha = FichaExposicao.montar(document.getElementById("alvo"), dados, {
        aoMudar: (novo) => console.log("mudou", novo.recursos),
        aoRolar: (pedido) => { console.log("rolar", pedido); ficha.mensagem("o host recebeu o pedido de rolagem"); },
      }, { rodape: true });
    </script>
  </body>
</html>
